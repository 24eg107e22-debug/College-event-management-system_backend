services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Docker on Render)
  # -------------------------------------------------------------
  - type: web
    name: college-event-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: mysql-17e3e519-anurag-1928.a.aivencloud.com
      - key: DB_PORT
        value: "28215"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false # Set securely in Render Dashboard (never commit to git)
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: JWT_SECRET
        generateValue: true

  # -------------------------------------------------------------
  # 2. React Vite Frontend (Render Static Site - Free & Fast CDN)
  # -------------------------------------------------------------
  - type: static
    name: college-event-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: college-event-backend
          envVarKey: RENDER_EXTERNAL_URL
