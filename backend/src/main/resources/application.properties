# Server Configuration (Render assigns dynamic PORT)
server.port=${PORT:8080}

# MySQL Datasource Configuration (Aiven MySQL Cloud)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-17e3e519-anurag-1928.a.aivencloud.com}:${DB_PORT:28215}/${DB_NAME:defaultdb}?sslMode=REQUIRED&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate Configuration
# update preserves existing tables and records; never drops data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# SQL Initialization
spring.sql.init.mode=never

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging Configuration
logging.level.com.campusconnect=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
